# Render.com deployment configuration — Docker mode
# Uses the Dockerfile in the backend/ directory

services:
  - type: web
    name: kisansetu-backend
    runtime: docker
    dockerfilePath: ./Dockerfile        # relative to repo root (if root dir is backend/)
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: mysql

      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: kisansetu
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,https://YOUR_APP.vercel.app

      - key: PLATFORM_FEE_PERCENTAGE
        value: "0.0"

      - key: GEMINI_API_KEY
        sync: false
