# File-based H2 Configuration — data persists between backend restarts.
# The DB files are stored in backend/data/kisansetudb.mv.db
# IMPORTANT: Switch to application-mysql.properties for production with a real MySQL server.
spring.datasource.url=jdbc:h2:file:./data/kisansetudb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 'update' — keeps all existing rows between restarts. Schema is evolved safely.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# H2 Console is disabled by default for security in production deployments.
# Set H2_CONSOLE_ENABLED=true if explicitly needed for debugging.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
