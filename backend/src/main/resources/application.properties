server.port=${PORT:8080}

# Application Name
spring.application.name=kisansetu-backend

# Active profile:
#   - locally defaults to 'h2' (no setup needed)
#   - on Render/production set env var SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# CORS Configuration
# Add your Vercel URL to CORS_ALLOWED_ORIGINS env var on Render
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://*.vercel.app,https://kisan-setu-bbdw7gv4l-pranav-eea6.vercel.app}

# Security / JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Platform Fee (Default 0% as per specification)
platform.fee.percentage=${PLATFORM_FEE_PERCENTAGE:0.0}

# Gemini API Key (Optional AI market explanation helper)
gemini.api.key=${GEMINI_API_KEY:}

# Multipart file upload limits (for future direct image upload support)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

