server.port=8080

# Application Name
spring.application.name=kisansetu-backend

# Primary profile defaults (supports MySQL environment variables, falls back to H2 if DB_HOST not explicitly provided)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Security / JWT
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=86400000

# Platform Fee (Default 0% as per specification)
platform.fee.percentage=${PLATFORM_FEE_PERCENTAGE:0.0}

# Gemini API Key (Optional AI market explanation helper)
gemini.api.key=${GEMINI_API_KEY:}
