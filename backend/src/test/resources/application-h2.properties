# Test-only H2 override \u2014 overrides the main application-h2.properties during tests.
# Uses in-memory H2 with create-drop so each test run starts with a completely clean schema.
# DO NOT change this to file-based \u2014 tests must be isolated and repeatable.
spring.datasource.url=jdbc:h2:mem:kisansetudb_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false
